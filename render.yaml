# Deploy as ONE Web Service (not Static Site) at https://sermon-hub-web.onrender.com
# Dashboard → New → Blueprint → connect repo, or update existing service to match below.
services:
  - type: web
    name: sermon-hub-web
    runtime: node
    plan: free
    buildCommand: npm run build:render
    startCommand: npm run start:render
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_ENDPOINT
        sync: false
      - key: S3_FORCE_PATH_STYLE
        value: "true"
      - key: MEMBER_PORTAL_URL
        value: https://sermon-hub-web.onrender.com
